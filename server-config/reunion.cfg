# Overrides applied onto ReUnion's stock reunion.cfg at build (a key is replaced in place).
# The build substitutes @SALT@ with a random per-image string (ReUnion refuses to start without one).
AuthVersion = 4
SteamIdHashSalt = @SALT@
# Every browser client sends the same emulator ticket, so a ticket-derived id collides ("SteamID already in use").
# Each relay session has its own 127.10.x.y source, so STEAM_ by IP [3] is unique per player.
cid_RevEmu = 3
cid_RevEmu2013 = 3
cid_SC2009 = 3
cid_OldRevEmu = 3
cid_SteamEmu = 3
cid_AVSMP = 3
cid_Setti = 3
cid_SXEI = 3
