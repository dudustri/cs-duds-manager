// Exec'd once per room. Per-mode cvars live in modes/<mode>/mode.cfg (applied after game.cfg on every map).
sv_lan 0
sv_allowdownload 0      // the browser already has every file; in-band downloads blow its 256 MiB heap
sv_allowupload 0
sv_send_logos 0
sv_maxrate 100000
sv_minrate 20000
sv_maxupdaterate 101
sv_minupdaterate 20
mp_timelimit 0          // rooms change map only by host vote
log off
bot_quota 0             // bots only come from the host's Add bot
bot_join_after_player 0
bot_chatter off         // the radio sounds are not shipped to browsers
